<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem('uppcl_smc_theme_v3');
        if (!savedTheme) {
          // If first time under v2, default to midnight theme
          savedTheme = 'light';
          localStorage.setItem('uppcl_smc_theme_v3', 'light');
          localStorage.setItem('uppcl_smc_theme', 'light');
        }
        if (!['light', 'dark', 'midnight'].includes(savedTheme)) {
          savedTheme = 'light';
        }
        document.documentElement.setAttribute('data-theme', savedTheme);
      } catch (e) {}
    })();
  </script>
  <title>UPPCL Social Media Cell | Consumer Grievance Management System</title>
